name: Release

# Pushing a version tag (vX.Y.Z, equal to the workspace version) builds, tests and publishes a
# release. A manual run, on any ref, builds the same package as a workflow artifact and
# publishes nothing.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    # Read-only: build scripts and tests never see a write token.
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Read the version
        id: version
        run: |
          $version = (cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).packages |
            Where-Object name -eq 'hyaline' | Select-Object -ExpandProperty version
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Check the tag matches the version
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ($env:GITHUB_REF_NAME -ne "v$env:VERSION") {
            throw "Tag $env:GITHUB_REF_NAME does not match the workspace version $env:VERSION"
          }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $zip = "hyaline-$env:VERSION-x64.zip"
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -DestinationPath "dist/$zip" -Path `
            target/release/hyaline.exe, target/release/hyaline_tap.dll, LICENSE
          $hash = (Get-FileHash "dist/$zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          # LF line ending, so `sha256sum -c` works on any system.
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", "$hash  $zip`n")
          Get-Content dist/SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($env:VERSION))\]" |
            Select-Object -First 1).LineNumber
          if (-not $start) { throw "CHANGELOG.md has no section for $env:VERSION" }
          $notes = foreach ($line in $lines[$start..($lines.Count - 1)]) {
            if ($line -match '^## \[') { break }
            if ($line -notmatch '^\[[^\]]+\]: ') { $line }
          }
          ($notes -join "`n").Trim() | Set-Content dist/notes.md -Encoding utf8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hyaline-${{ steps.version.outputs.version }}-x64
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub release
      id-token: write # build provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hyaline-${{ needs.build.outputs.version }}-x64
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/hyaline-*.zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Hyaline $VERSION" \
            --notes-file dist/notes.md "dist/hyaline-$VERSION-x64.zip" dist/SHA256SUMS.txt
