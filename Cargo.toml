[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

# The helper DLL's `guard` relies on `catch_unwind`, so panics keep unwinding.
[profile.release]
codegen-units = 1
lto = true
# Size over speed: the work per event is tiny (measured: 650 KB vs 736 KB total at level 3).
opt-level = "s"
strip = true
